name: Prod DevSecOps Pipeline

on:
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.8.1
  INFRA_PATH: ecs-infra
  CODE_PATH: src
  PYTHON_VERSION: "3.13"

jobs:

  infra-checks:
    name: Infrastructure Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive -chdir=${{ env.INFRA_PATH }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.INFRA_PATH }}
          framework: terraform
          output_format: cli
          soft_fail: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Initialize TFLint
        run: tflint --init --chdir=${{ env.INFRA_PATH }}

      - name: Lint Terraform
        run: tflint --format compact --chdir=${{ env.INFRA_PATH }}

  infra-plan:
    name: Infrastructure Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS authentication
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::879381241087:role/aws-github-oidc-aug26
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform -chdir=${{ env.INFRA_PATH }} init -backend-config=vars/prod.tfbackend

      - name: Terraform plan
        run: terraform -chdir=${{ env.INFRA_PATH }} plan -var-file=vars/prod.tfvars

  code-basic:
    name: Code Quality and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff lint
        uses: adityabhangle658/ruff-python-lint-format-check-pr@v1.0.3

      - name: Install dependencies and run unit tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r ${{ env.CODE_PATH }}/requirements.txt
          pip install pytest pytest-cov
          pytest -v \
            --cov=${{ env.CODE_PATH }} \
            --cov-report=xml \
            --cov-report=term-missing \
            ${{ env.CODE_PATH }}/tests/

      - name: Smoke test
        env:
          DB_LINK: "sqlite:///:memory:"
          BASE_URL: "http://localhost:8000"
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash .github/scripts/smoke-test.sh
