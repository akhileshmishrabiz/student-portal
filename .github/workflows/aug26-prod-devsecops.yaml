
name: Prod DevSecOps Pipeline aug26

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: "1.8.1"
  INFRA_PATH: ecs-infra
  CODE_PATH: src
  PYTHON_VERSION: "3.13"
  APP_PORT: "8000"
  DAST_TARGET: http://localhost:8000

jobs:
  # -----------------------------
  # Infrastructure Security Checks
  # -----------------------------
  infra-checks:
    name: Infrastructure Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format check
        run: |
          cd ${{ env.INFRA_PATH }}
          terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          cd ${{ env.INFRA_PATH }}
          terraform init -backend=false
          terraform validate

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.INFRA_PATH }}
          framework: terraform
          output_format: cli
          soft_fail: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: Initialize TFLint
        run: tflint --init --chdir=${{ env.INFRA_PATH }}

      - name: Lint Terraform
        run: tflint --format compact --chdir=${{ env.INFRA_PATH }}

  # -----------------------------
  # Infrastructure Plan
  # -----------------------------
  infra-plan:
    name: Infrastructure Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AWS authentication
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::879381241087:role/aws-github-oidc-aug26
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init and plan
        run: |
          cd ${{ env.INFRA_PATH }}
          terraform init -backend-config=vars/prod.tfbackend
          terraform plan -var-file=vars/prod.tfvars

  # -----------------------------
  # Code Quality and Testing
  # -----------------------------
  code-basic:
    name: Code Quality and Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff lint
        run: |
          python -m pip install ruff
          ruff check ${{ env.CODE_PATH }}

      - name: Install dependencies and run unit tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r ${{ env.CODE_PATH }}/requirements.txt
          pip install pytest pytest-cov
          pytest -v \
            --cov=${{ env.CODE_PATH }} \
            --cov-report=xml \
            --cov-report=term-missing \
            ${{ env.CODE_PATH }}/tests/

      - name: Smoke test
        env:
          DB_LINK: "sqlite:///:memory:"
          BASE_URL: "http://localhost:8000"
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash .github/scripts/smoke-test.sh

  # -----------------------------
  # Dynamic Application Security Testing
  # -----------------------------
  dast-baseline:
    name: DAST Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t student-portal-dast ${{ env.CODE_PATH }}

      - name: Start application
        env:
          ADMIN_PASSWORD: ${{ secrets.DAST_PASSWORD }}
        run: |
          docker run -d --name student-portal-dast \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            -e DB_LINK=sqlite:////tmp/student_portal.db \
            -e SECRET_KEY=dast-ci-secret-key \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            student-portal-dast

      - name: Wait for application health
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${{ env.DAST_TARGET }}/health"; then
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 3
          done

          docker logs student-portal-dast
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.DAST_TARGET }}
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -I
        continue-on-error: true

      - name: Stop application container
        if: always()
        run: docker rm -f student-portal-dast || true

  # -----------------------------
  # Container Image Security Scan
  # -----------------------------
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest

    # Image build + CVE scan is slower; run on main pushes only, not every PR
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t student-portal:${{ github.sha }} src

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          image-ref: student-portal:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          scan-type: image
          exit-code: "1"
          ignore-unfixed: true

  # -----------------------------
  # Static Application Security Testing
  # -----------------------------
  code-static-scan:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Run CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          language: python

      # Upload CodeQL SARIF report as a downloadable artifact.
      # Access: GitHub → Actions → Workflow Run → Artifacts.
      - name: Upload CodeQL Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-security-report
          path: results/
          if-no-files-found: warn
          retention-days: 30

  sonar-scan:
    name: SonarQube Scan & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        